site_name: CÄRE Documentation
site_description: Documentation for the CÄRE game engine
site_url: https://care2d.org/

nav:
  - Home: index.md
  - API: api/

theme:
  name: material
  logo: assets/care-logo-border.png
  favicon: assets/care-logo.png
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  custom_dir: overrides

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/care.css

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.highlight:
      anchor_linenums: true

extra:
  generator: false

copyright: >
  &copy; 2026 Antikythera Games. Released under the MIT License.